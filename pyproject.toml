[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aeon-termux-agent"
version = "0.1.0"
description = "Safe OpenAI-compatible agent for Termux and remote GPU inference"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27", "pydantic>=2.8", "python-dotenv>=1.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
